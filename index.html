<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent conversationnel · démo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --mute:#667085; --line:#d9dde5; --accent:#2457d6; --err:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2029; --ink:#e8ebf2; --mute:#98a2b3; --line:#2e3542; --accent:#6c93ff; --err:#f97066; --ok:#47cd89; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 4px; }
  .sub { color:var(--mute); margin:0 0 16px; font-size:.92rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:12px 0 4px; }
  input[type=text], input[type=password], input[type=url], select, textarea {
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea { resize:vertical; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .row > * { flex:1 1 auto; }
  .row > button { flex:0 0 auto; }
  .hint { color:var(--mute); font-size:.85rem; margin-top:4px; }
  .hint a { color:var(--accent); }
  .check { display:flex; gap:8px; align-items:center; font-weight:400; margin:12px 0 0; }
  .check input { width:auto; }
  #chat { display:flex; flex-direction:column; gap:10px; min-height:120px; max-height:55vh; overflow:auto; padding:4px 0; }
  .msg { padding:10px 12px; border-radius:10px; max-width:90%; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.assistant { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
  .msg.pending { color:var(--mute); font-style:italic; }
  #error { color:var(--err); margin:8px 0 0; min-height:1.2em; white-space:pre-wrap; }
  #status { color:var(--mute); font-size:.85rem; }
  details { margin:12px 0 0; }
  summary { cursor:pointer; font-weight:600; font-size:.9rem; }
  #history { list-style:none; padding:0; margin:8px 0 0; font-size:.88rem; }
  #history li { border-top:1px solid var(--line); padding:8px 0; overflow-wrap:anywhere; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Agent conversationnel</h1>
  <p class="sub">Apportez votre propre clé API. Elle reste dans votre navigateur. Utilisez des données fictives uniquement.</p>

  <section id="login" class="card">
    <label for="provider">Fournisseur</label>
    <select id="provider"></select>

    <div id="customWrap" class="hidden">
      <label for="baseUrl">Adresse de l'API (compatible OpenAI, https obligatoire)</label>
      <input type="url" id="baseUrl" placeholder="https://exemple.com/v1" autocomplete="off">
    </div>

    <label for="apiKey">Clé API</label>
    <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="Collez votre clé ici">
    <div class="hint" id="keyHelp"></div>

    <label for="model">Modèle <span style="font-weight:400">(facultatif)</span></label>
    <input type="text" id="model" autocomplete="off" spellcheck="false" placeholder="Laissez vide : choix automatique">

    <label class="check"><input type="checkbox" id="remember" checked> Mémoriser la clé dans ce navigateur</label>

    <div class="row" style="margin-top:16px"><button id="connect">Se connecter</button></div>
    <div id="loginError" class="hint" style="color:var(--err)" role="alert"></div>
  </section>

  <section id="app" class="card hidden">
    <div class="row" style="align-items:center">
      <span id="status"></span>
      <button class="secondary" id="forget" type="button">Oublier ma clé</button>
    </div>

    <details>
      <summary>Rôle de l'agent</summary>
      <textarea id="system" rows="3"></textarea>
      <div class="hint">Message système : il oriente le comportement de l'agent. Il s'applique au prochain message.</div>
    </details>

    <div id="chat" aria-live="polite"></div>
    <div id="error" role="alert"></div>

    <div class="row" style="margin-top:8px">
      <textarea id="input" rows="2" placeholder="Votre message (Entrée pour envoyer, Maj+Entrée pour une ligne)"></textarea>
      <button id="send">Envoyer</button>
    </div>

    <label class="check hidden" id="saveWrap"><input type="checkbox" id="saveFs"> Enregistrer mes échanges dans Firestore</label>

    <details id="historyWrap" class="hidden">
      <summary>Derniers échanges enregistrés</summary>
      <ul id="history"></ul>
    </details>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
